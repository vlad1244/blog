<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#5680e9"/><stop offset="1" stop-color="#5ab9ea"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#5ab9ea"/><stop offset="1" stop-color="#84ceeb"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#8860d0"/><stop offset="1" stop-color="#5680e9"/></linearGradient>
  </defs>
  <rect width="720" height="760" rx="28" fill="#f6f8ff"/>
  <text x="40" y="76" font-size="38" font-weight="700" fill="#1c2350">Из 100 написавших</text>
  <text x="40" y="122" font-size="38" font-weight="700" fill="#1c2350">по рекламе</text>

  <rect x="40" y="160" width="640" height="104" rx="20" fill="url(#g1)"/>
  <text x="72" y="228" font-size="50" font-weight="700" fill="#fff">100</text>
  <text x="190" y="226" font-size="30" fill="#fff">написали в директ</text>

  <rect x="40" y="300" width="493" height="104" rx="20" fill="url(#g2)"/>
  <text x="72" y="368" font-size="50" font-weight="700" fill="#fff">77</text>
  <text x="160" y="366" font-size="30" fill="#fff">написали 2+</text>
  <text x="40" y="446" font-size="28" font-weight="700" fill="#5680e9">−23 <tspan font-weight="400" fill="#56608a">оборвались после первого</tspan></text>

  <rect x="40" y="484" width="365" height="104" rx="20" fill="url(#g3)"/>
  <text x="72" y="552" font-size="50" font-weight="700" fill="#fff">57</text>
  <text x="160" y="550" font-size="30" fill="#fff">ответили</text>
  <text x="40" y="630" font-size="28" font-weight="700" fill="#8860d0">−20 <tspan font-weight="400" fill="#56608a">зона администратора,</tspan></text>
  <text x="40" y="668" font-size="28" fill="#56608a">а не рекламы</text>

  <text x="40" y="726" font-size="20" fill="#56608a">Студия в Узбекистане, октябрь 2026</text>
</svg>
